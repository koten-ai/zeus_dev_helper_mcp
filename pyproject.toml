[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeus-dev-helper-mcp"
version = "0.7.1"
description = "Developer Helper MCP — first Zeus-powered app onboarding coach (ZDH)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Koten AI" }]
keywords = ["mcp", "zeus", "koten", "onboarding", "coach"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "mcp>=1.8.0,<3",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://docs.koten.ai/zeus-client/dev-helper-mcp"
Documentation = "https://docs.koten.ai/zeus-client/dev-helper-mcp"
Repository = "https://github.com/koten-ai/zeus_dev_helper_mcp"
Changelog = "https://github.com/koten-ai/zeus_dev_helper_mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/koten-ai/zeus_dev_helper_mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2", "twine>=5.1"]
agent = ["kotenai-zeus-client>=2.3.0"]

[project.scripts]
zeus-dev-helper-mcp = "zeus_dev_helper_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zeus_dev_helper_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/guides",
  "/README.md",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/server.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
