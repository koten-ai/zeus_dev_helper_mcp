[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeus-dev-helper-mcp"
version = "0.4.0"
description = "Developer Helper MCP — first Zeus-powered app onboarding coach (ZDH)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Koten AI" }]
dependencies = [
  "mcp>=1.8.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
agent = ["kotenai-zeus-client>=1.0.0"]

[project.scripts]
zeus-dev-helper-mcp = "zeus_dev_helper_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zeus_dev_helper_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/zeus_dev_helper_mcp", "README.md", "AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
